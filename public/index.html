<!DOCTYPE html>
<html>
<body>
  <button id="start">音声を聴く</button>
  <audio id="audio" autoplay></audio>
  <p>再生バッファ遅延 : <span id="display-delay">0.00</span> ms</p>
  <p>ネットワーク遅延 : <span id="display-network-latency">0.0</span> ms</p>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const pc = new RTCPeerConnection();

    document.getElementById('start').onclick = async () => {
      pc.ontrack = (e) => {
        document.getElementById('audio').srcObject = e.streams[0];
      };

      // 受信専用の設定
      pc.addTransceiver('audio', { direction: 'recvonly' });
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit('offer', offer);
    };

    socket.on('answer', (answer) => pc.setRemoteDescription(answer));
    
    // ジッターバッファによる1秒間の平均遅延時間測定及びネットワークレイテンシ計算用
    //
    // ネットワークから届く音声パケットは到着時間がバラバラ
    // そのまま再生すると音がブツブツ切れてしまう
    // そのため、パケットをバッファに溜めて「順番待ち」させる→ジッター吸収のためにバッファに滞留した平均時間
    
    // 前回の値を保存する変数
    let lastStats = {
      delay: 0,
      count: 0
    };

    setInterval(async () => {
      const stats = await pc.getStats();

      stats.forEach(report => {
        if (report.type === "inbound-rtp" && report.kind === "audio") {
          
          // 前回の実行時からの増加分を計算
          const deltaDelay = report.jitterBufferDelay - lastStats.delay;
          const deltaCount = report.jitterBufferEmittedCount - lastStats.count;
          
          // RTTに関する情報をログ出力
          console.log(Array.from(stats).filter(([_, r]) => r.roundTripTime || r.currentRoundTripTime));

          if (deltaCount > 0) {
            // この1秒間における平均遅延
            const currentAvgDelay = deltaDelay / deltaCount;
            const delayMs = (currentAvgDelay * 1000).toFixed(2); // ミリ秒換算

            console.log(`--- Real-time Audio Stats ---`);
            console.log(`Current Delay : ${delayMs} ms`);
            console.log(`Jitter        : ${(report.jitter * 1000).toFixed(2)} ms`);
            console.log(`Packets Lost  : ${report.packetsLost}`);

            document.getElementById('display-delay').textContent = delayMs;
          }

          // 今回の値を保存
          lastStats.delay = report.jitterBufferDelay;
          lastStats.count = report.jitterBufferEmittedCount;
        }

        // ネットワーク遅延（candidate-pair）
        if (report.type === "candidate-pair" && report.state === "succeeded") {
          if (typeof report.currentRoundTripTime !== 'undefined') {
            // 片道遅延 = RTT / 2
            const networkMs = (report.currentRoundTripTime / 2 * 1000).toFixed(1);
            document.getElementById('display-network-latency').textContent = networkMs;
          }
        }
      });
    }, 1000);
  </script>
</body>
</html>
