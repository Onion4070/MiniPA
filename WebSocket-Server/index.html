<!DOCTYPE html>
<html lang="ja">
<body>
<button onclick="start()">Start</button>
<div id="delay"></div>

<script>
let ws;
let ctx;
let nextTime = 0;
let offset = null;
let isAdjusting = false; // 補正フラグ

function start(){
  ctx = new AudioContext({latencyHint: 0.001 });

  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => console.log("connected");

  ws.onmessage = e => {
    const view = new DataView(e.data);
    // サーバ送信時刻
    const sendTime = view.getFloat64(0, true);
    // クライアント受信時刻
    const recvTime = performance.now()/1000;
    // オフセット推定
    if (offset === null || recvTime - sendTime < offset)
      offset = recvTime - sendTime;

    // 通信遅延
    const netDelay = recvTime - sendTime - offset;

    const float32 = new Float32Array(e.data, 8);

    // ステレオのバッファを作成
    const frames = float32.length / 2;
    const buf = ctx.createBuffer(2, frames, 48000);
    const ch0 = buf.getChannelData(0);
    const ch1 = buf.getChannelData(1);

    for (let i=0, j=0; i < frames; i++, j+=2) {
      ch0[i] = float32[j];
      ch1[i] = float32[j+1];
    }

    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);

    // 遅延防止：再生時刻を詰める
    const now = ctx.currentTime;

    const bufferDelay = nextTime - now;
    const total = netDelay + bufferDelay;

    const TARGET = 0.030;           // 目標値: 30ms
    const START_THRESHOLD = 0.015;  // 補正開始閾値: 15ms超過で開始
    const STOP_THRESHOLD  = 0.005;  // 補正終了閾値: 5ms以内で停止
    const CORRECTION_STEP = 0.002;  // 補正ステップ: 2ms
    const MAX_CORRECTION  = 0.050;  // 最大補正量: 50ms
    
    const error = bufferDelay - TARGET;  // 目標値からの誤差
    
    // ヒステリシス制御
    if (Math.abs(error) > START_THRESHOLD) isAdjusting = true;   // 補正開始
    if (Math.abs(error) < STOP_THRESHOLD)  isAdjusting = false;  // 補正終了

    if (bufferDelay < 0) {
      // 早すぎ
      nextTime = now + TARGET;
    }

    if (bufferDelay > 0.200) {
      // 200ms以上の遅延は強制リセット
      nextTime = now + TARGET;
      isAdjusting = false;
    }

    if (isAdjusting && Math.abs(error) > STOP_THRESHOLD) {
      let correction = Math.sign(error) * Math.min(CORRECTION_STEP, Math.abs(error) * 0.1);  // 補正量を計算
      correction = Math.max(-MAX_CORRECTION, Math.min(MAX_CORRECTION, correction));          // 補正量を制限()
      nextTime -= correction; // 補正を適用
    }

    document.getElementById("delay").innerHTML = `
    total ${ (total*1000).toFixed(1)} ms<br>
    network ${ (netDelay*1000).toFixed(1)} ms / buffer ${ (bufferDelay*1000).toFixed(1)} ms<br>
    now: ${now.toFixed(2)} / next: ${nextTime.toFixed(2)}
    `;

    src.start(nextTime);
    nextTime += buf.duration;
  };
}
</script>
</body>
</html>
