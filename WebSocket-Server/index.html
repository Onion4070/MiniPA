<!DOCTYPE html>
<html lang="ja">
<body>
<button id="startBtn">Start</button>
TARGET (ms): <input type="number" id="target" value="30" style="width:50px">
<br>
<div id="status" style="color:blue; margin:4px 0"></div>
<div id="error"  style="color:red;  margin:4px 0"></div>
<div id="delay"  style="margin:4px 0"></div>
<div id="debug"  style="color:gray; font-size:12px; white-space:pre"></div>

<!-- wasm opus-decoder charset="UTF-8" が必須 -->
<script src="https://cdn.jsdelivr.net/npm/opus-decoder@0.7.11/dist/opus-decoder.min.js" charset="UTF-8"></script>

<script>
// ── UI helpers ────────────────────────────────────────────
const $ = id => document.getElementById(id);
function setStatus(msg) { $("status").textContent = msg; }
function setError(msg)  { $("error").textContent  = msg; }
function addDebug(msg)  {
  const ts = performance.now().toFixed(0);
  $("debug").textContent = `[${ts}ms] ${msg}\n` + $("debug").textContent.split("\n").slice(0,30).join("\n");
}

let ws=null, ctx=null, decoder=null, wasmDec=null;
let useWasm=false, nextTime=0, offset=null, isAdjusting=false;
const pendingMeta = [];

// ── 再生スケジューラ ───────────────────────────────────────
function scheduleFloat32(left, right, sampleRate, sendTime, recvTime) {
  const frames = left.length;
  const buf = ctx.createBuffer(2, frames, sampleRate);
  buf.getChannelData(0).set(left);
  buf.getChannelData(1).set(right);

  const netDelay    = recvTime - sendTime - offset;
  const now         = ctx.currentTime;
  const bufferDelay = nextTime - now;
  const TARGET = (parseFloat($("target").value) || 30) / 1000;

  const START_THRESHOLD = 0.015, STOP_THRESHOLD = 0.005;
  const CORRECTION_STEP = 0.002, MAX_CORRECTION  = 0.050;
  const error = bufferDelay - TARGET;

  if (Math.abs(error) > START_THRESHOLD) isAdjusting = true;
  if (Math.abs(error) < STOP_THRESHOLD)  isAdjusting = false;
  if (bufferDelay < 0)      nextTime = now + TARGET;
  if (bufferDelay > 0.200) { nextTime = now + TARGET; isAdjusting = false; }
  if (isAdjusting && Math.abs(error) > STOP_THRESHOLD) {
    let c = Math.sign(error) * Math.min(CORRECTION_STEP, Math.abs(error) * 0.1);
    nextTime -= Math.max(-MAX_CORRECTION, Math.min(MAX_CORRECTION, c));
  }

  $("delay").textContent =
    `total ${((netDelay+bufferDelay)*1000).toFixed(1)} ms | ` +
    `net ${(netDelay*1000).toFixed(1)} ms / buf ${(bufferDelay*1000).toFixed(1)} ms`;

  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.start(nextTime);
  nextTime += buf.duration;
}

// ── native AudioDecoder output ────────────────────────────
function onNativeOutput(audioData) {
  const item = pendingMeta.shift();
  if (!item) { audioData.close(); return; }
  const frames = audioData.numberOfFrames;
  const ch     = audioData.numberOfChannels;
  const sr     = audioData.sampleRate;
  let left, right;
  if (audioData.format === "f32-planar") {
    left  = new Float32Array(frames);
    right = new Float32Array(frames);
    audioData.copyTo(left,  { planeIndex: 0 });
    audioData.copyTo(right, { planeIndex: ch > 1 ? 1 : 0 });
  } else {
    const interleaved = new Float32Array(frames * ch);
    audioData.copyTo(interleaved, { planeIndex: 0 });
    left  = new Float32Array(frames);
    right = new Float32Array(frames);
    for (let i = 0; i < frames; i++) {
      left[i]  = interleaved[i * ch];
      right[i] = interleaved[i * ch + (ch > 1 ? 1 : 0)];
    }
  }
  audioData.close();
  scheduleFloat32(left, right, sr, item.sendTime, item.recvTime);
}

// ── Secure Contextかどうか確認 ────────────────────────────
function isSecureContext() {
  return window.isSecureContext === true;
}

// ── デコーダ初期化 ─────────────────────────────────────────
async function initDecoder() {
  // Secure Context かつ AudioDecoder が使える場合のみnativeを試みる
  if (isSecureContext() && typeof AudioDecoder !== "undefined") {
    try {
      const sup = await AudioDecoder.isConfigSupported({
        codec: "opus", sampleRate: 48000, numberOfChannels: 2
      });
      addDebug(`AudioDecoder.isConfigSupported: ${sup.supported}`);
      if (sup.supported) {
        decoder = new AudioDecoder({
          output: onNativeOutput,
          error: e => { setError(`AudioDecoder: ${e.message ?? e}`); addDebug(`AudioDecoder err: ${e}`); }
        });
        decoder.configure({ codec: "opus", sampleRate: 48000, numberOfChannels: 2 });
        useWasm = false;
        setStatus("デコーダ: native AudioDecoder");
        return;
      }
    } catch(e) { addDebug(`AudioDecoder probe failed: ${e}`); }
  } else {
    addDebug(`AudioDecoder skip: secureContext=${isSecureContext()}, available=${typeof AudioDecoder !== "undefined"}`);
  }

  // フォールバック: WASM (scriptタグで読み込み済みのOpusDecoderを使用)
  setStatus("デコーダ: WASM (初期化中...)");
  try {
    // scriptタグ読み込みでwindow.OpusDecoderとして展開される
    const OpusDecoderClass = window["opus-decoder"]?.OpusDecoder;
    if (!OpusDecoderClass) throw new Error("window['opus-decoder'].OpusDecoder が見つかりません");
    
    wasmDec = new OpusDecoderClass();
    await wasmDec.ready;
    useWasm = true;
    setStatus("デコーダ: WASM Audio Decoders opus-decoder");
    addDebug("WASM OpusDecoder ready");
  } catch(e) {
    setError(`デコーダ初期化失敗: ${e.message}`);
    addDebug(`initDecoder failed: ${e}`);
    throw e;
  }
}

async function start() {
  setError("");
  if (ws)      { ws.onmessage = null; ws.close(); ws = null; }
  if (decoder) { try { decoder.close(); } catch(_){} decoder = null; }
  if (wasmDec) { try { wasmDec.free();  } catch(_){} wasmDec = null; }
  if (ctx)     { await ctx.close(); ctx = null; }
  offset = null; nextTime = 0; isAdjusting = false;
  pendingMeta.length = 0;

  addDebug(`UA: ${navigator.userAgent.substring(0,80)}`);
  addDebug(`secureContext: ${isSecureContext()}`);  // ← HTTP環境での確認用

  ctx = new AudioContext({ latencyHint: "interactive", sampleRate: 48000 });
  addDebug(`AudioContext: state=${ctx.state} sr=${ctx.sampleRate}`);
  if (ctx.state === "suspended") { await ctx.resume(); addDebug(`resumed: ${ctx.state}`); }

  try {
    await initDecoder();
  } catch(e) { return; }

  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen  = () => addDebug("WS connected");
  ws.onclose = e => { setError(`WS closed: ${e.code}`); addDebug(`WS close: ${e.code} ${e.reason}`); };
  ws.onerror = () => { setError("WS error"); addDebug("WS error event"); };

  ws.onmessage = async e => {
    const view     = new DataView(e.data);
    const sendTime = view.getFloat64(0, true);
    const opusLen  = view.getUint16(8, true);
    const opusData = new Uint8Array(e.data, 10, opusLen);
    const recvTime = performance.now() / 1000;

    if (offset === null || recvTime - sendTime < offset) offset = recvTime - sendTime;

    if (useWasm) {
      try {
        const r = wasmDec.decodeFrame(opusData);  // 同期・1フレーム単位
        if (r.samplesDecoded > 0) {
          const L = r.channelData[0];
          const R = r.channelData[1] ?? r.channelData[0];
          scheduleFloat32(L, R, r.sampleRate, sendTime, recvTime);
        }
      } catch(err) { setError(`WASM decode: ${err.message}`); addDebug(`WASM err: ${err}`); }
    } else {
      pendingMeta.push({ sendTime, recvTime });
      try {
        decoder.decode(new EncodedAudioChunk({
          type: "key",
          timestamp: Math.round(sendTime * 1_000_000),
          data: opusData,
        }));
      } catch(err) { setError(`decode: ${err.message}`); addDebug(`decode err: ${err}`); }
    }
  };
}

$("startBtn").addEventListener("click", start);
</script>
</body>
</html>
